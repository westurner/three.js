		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",

				}

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { float, If, PI, color, cos, instanceIndex, Loop, mix, mod, sin, instancedArray, Fn, uint, uniform, uniformArray, hash, vec3, vec4 } from 'three/tsl';

			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { ValueJSONTextarea } from 'three/addons/inspector/ui/Values.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { TransformControls } from 'three/addons/controls/TransformControls.js';
			import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

			let camera, scene, renderer, labelRenderer, controls, updateCompute, configuration;
			let journalStartTime = 0;
			let isPlaying = false;
			let playbackStartTimestamp = 0;
			let playbackStartTimeOffset = 0;
			let timeSlider;
			let lastGuiUpdate = 0;
			let labelsNeedUpdate = true;

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 25, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 3, 5, 8 );

				scene = new THREE.Scene();

				// ambient light

				const ambientLight = new THREE.AmbientLight( '#ffffff', 0.5 );
				scene.add( ambientLight );

				// directional light

				const directionalLight = new THREE.DirectionalLight( '#ffffff', 1.5 );
				directionalLight.position.set( 4, 2, 0 );
				scene.add( directionalLight );

				// renderer

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				// renderer.setAnimationLoop( animate );
				renderer.setClearColor( '#000000' );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				labelRenderer = new CSS2DRenderer();
				labelRenderer.setSize( window.innerWidth, window.innerHeight );
				labelRenderer.domElement.style.position = 'fixed';
				labelRenderer.domElement.style.top = '0';
				labelRenderer.domElement.style.left = '0';
				labelRenderer.domElement.style.pointerEvents = 'none';
				labelRenderer.domElement.style.zIndex = '1';
				document.body.appendChild( labelRenderer.domElement );

				await renderer.init();

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 0.1;
				controls.maxDistance = 50;

				controls.addEventListener( 'change', () => {
					labelsNeedUpdate = true;

					if ( configuration ) {

						configuration.cameraPosX = camera.position.x;
						configuration.cameraPosY = camera.position.y;
						configuration.cameraPosZ = camera.position.z;
						configuration.cameraTargetX = controls.target.x;
						configuration.cameraTargetY = controls.target.y;
						configuration.cameraTargetZ = controls.target.z;
						configuration.cameraZoom = camera.zoom;
						configuration.cameraFov = camera.fov;
						configuration.cameraNear = camera.near;
						configuration.cameraFar = camera.far;

					}

					recordChange( 'sys:camera', {
						position: camera.position.toArray(),
						target: controls.target.toArray(),
						zoom: camera.zoom,
						fov: camera.fov,
						near: camera.near,
						far: camera.far
					} );

				} );

				window.addEventListener( 'resize', onWindowResize );

				// attractors

				const MAX_ATTRACTORS = 20;
				const initialAttractorsPositions = [
					new THREE.Vector3( - 1, 0, 0 ),
					new THREE.Vector3( 1, 0, - 0.5 ),
					new THREE.Vector3( 0, 0.5, 1 )
				];
				const initialAttractorsRotationAxes = [
					new THREE.Vector3( 0, 1, 0 ),
					new THREE.Vector3( 0, 1, 0 ),
					new THREE.Vector3( 1, 0, - 0.5 ).normalize()
				];
				const initialAttractorsMagnitudes = [ 1, 1, 1 ];

				for ( let i = initialAttractorsPositions.length; i < MAX_ATTRACTORS; i ++ ) {

					initialAttractorsPositions.push( new THREE.Vector3( 0, 0, 0 ) );
					initialAttractorsRotationAxes.push( new THREE.Vector3( 0, 1, 0 ) );
					initialAttractorsMagnitudes.push( 1 );

				}

				const attractorsPositions = uniformArray( initialAttractorsPositions );
				const attractorsRotationAxes = uniformArray( initialAttractorsRotationAxes );
				const attractorsMagnitudes = uniformArray( initialAttractorsMagnitudes );
				const attractorsLength = uniform( 3, 'uint' );
				const attractors = [];
				const helpersRingGeometry = new THREE.RingGeometry( 1, 1.02, 32, 1, 0, Math.PI * 1.5 );
				const helpersArrowGeometry = new THREE.ConeGeometry( 0.1, 0.4, 12, 1, false );
				const helpersMaterial = new THREE.MeshBasicMaterial( { side: THREE.DoubleSide } );
				const cameraQuaternion = new THREE.Quaternion();
				const referenceQuaternion = new THREE.Quaternion();
				const cameraDown = new THREE.Vector3();

				function updateAttractorLabelPosition( attractor, worldDown = null ) {

					const showName = configuration ? configuration.helperShowName : false;
					attractor.label.visible = showName;

					if ( ! showName || ! configuration || ! configuration.helperShowNamesBelow ) {

						attractor.label.position.set( 0, 1.5, 0 );
						return;

					}

					if ( worldDown === null ) {

						cameraDown.set( 0, - 1, 0 ).applyQuaternion( camera.getWorldQuaternion( cameraQuaternion ) );
						worldDown = cameraDown;

					}

					referenceQuaternion.copy( attractor.reference.quaternion ).invert();
					attractor.label.position.copy( worldDown ).applyQuaternion( referenceQuaternion ).multiplyScalar( 1.5 );

				}

				function updateAttractorLabelPositions() {

					if ( ! configuration || ! configuration.helperShowName ) {

						attractors.forEach( attractor => attractor.label.visible = false );
						return;

					}

					if ( ! configuration.helperShowNamesBelow ) {

						attractors.forEach( attractor => updateAttractorLabelPosition( attractor ) );
						return;

					}

					cameraDown.set( 0, - 1, 0 ).applyQuaternion( camera.getWorldQuaternion( cameraQuaternion ) );
					attractors.forEach( attractor => updateAttractorLabelPosition( attractor, cameraDown ) );

				}

				function updateAttractorHelper( index ) {

					const attractor = attractors[ index ];
					if ( ! attractor ) return;

					const magnitudes = attractors.map( item => Math.max( 0, Number( item.magnitude ) ) );
					const positiveMagnitudes = magnitudes.filter( magnitude => magnitude > 0 );
					const magnitude = Math.max( 0, Number( attractor.magnitude ) );
					let arrowScale = 0.25;

					if ( positiveMagnitudes.length > 0 ) {

						const minLogMagnitude = Math.log10( Math.min( ...positiveMagnitudes ) );
						const maxLogMagnitude = Math.log10( Math.max( ...positiveMagnitudes ) );

						if ( minLogMagnitude === maxLogMagnitude ) {

							arrowScale = 1;

						} else if ( magnitude > 0 ) {

							arrowScale = 0.25 + 0.75 * ( Math.log10( magnitude ) - minLogMagnitude ) / ( maxLogMagnitude - minLogMagnitude );

						}

					}

					attractor.arrow.scale.set( 1, arrowScale, 1 );
					attractor.label.element.textContent = attractor.name;
					attractor.label.visible = configuration ? configuration.helperShowName : false;
					updateAttractorLabelPosition( attractor );

				}

				function updateAttractorHelpers() {

					attractors.forEach( ( attractor, index ) => updateAttractorHelper( index ) );

				}

				function createAttractor( i ) {

					const attractor = {};

					attractor.position = attractorsPositions.array[ i ];
					attractor.orientation = attractorsRotationAxes.array[ i ];
					attractor.magnitude = attractorsMagnitudes.array[ i ];
					attractor.name = `Attractor ${i}`;
					attractor.reference = new THREE.Object3D();
					attractor.reference.position.copy( attractor.position );
					attractor.reference.quaternion.setFromUnitVectors( new THREE.Vector3( 0, 1, 0 ), attractor.orientation );
					scene.add( attractor.reference );

					attractor.helper = new THREE.Group();
					attractor.helper.scale.setScalar( 0.325 );
					attractor.reference.add( attractor.helper );

					attractor.ring = new THREE.Mesh( helpersRingGeometry, helpersMaterial );
					attractor.ring.rotation.x = - Math.PI * 0.5;
					attractor.helper.add( attractor.ring );

					attractor.arrow = new THREE.Mesh( helpersArrowGeometry, helpersMaterial );
					attractor.arrow.position.x = 1;
					attractor.arrow.position.z = 0.2;
					attractor.arrow.rotation.x = Math.PI * 0.5;
					attractor.helper.add( attractor.arrow );

					attractor.label = new CSS2DObject();
					attractor.label.position.set( 0, 1.5, 0 );
					attractor.label.element.className = 'attractor-label';
					attractor.reference.add( attractor.label );

					attractor.controls = new TransformControls( camera, renderer.domElement );
					attractor.controls.mode = 'rotate';
					attractor.controls.size = 0.5;
					attractor.controls.attach( attractor.reference );
					attractor.controls.visible = true;

					if ( configuration && configuration.controlsMode ) {

						if ( configuration.controlsMode === 'none' ) {

							attractor.controls.visible = false;
							attractor.controls.getHelper().visible = false;

						} else {

							attractor.controls.mode = configuration.controlsMode;

						}

					}

					attractor.controls.enabled = attractor.controls.visible;
					const cx = new THREE.Color( configuration ? configuration.controlsColorX : '#222222' ).getHex( THREE.SRGBColorSpace );
					const cy = new THREE.Color( configuration ? configuration.controlsColorY : '#222222' ).getHex( THREE.SRGBColorSpace );
					const cz = new THREE.Color( configuration ? configuration.controlsColorZ : '#222222' ).getHex( THREE.SRGBColorSpace );
					attractor.controls.setColors( cx, cy, cz );

					scene.add( attractor.controls.getHelper() );

					attractor.controls.addEventListener( 'dragging-changed', ( event ) => {

						controls.enabled = ! event.value;

					} );

					attractor.controls.addEventListener( 'change', () => {

						attractor.position.copy( attractor.reference.position );
						attractor.orientation.copy( new THREE.Vector3( 0, 1, 0 ).applyQuaternion( attractor.reference.quaternion ) );
					} );

					attractors.push( attractor );
					updateAttractorHelper( i );

				}

				for ( let i = 0; i < attractorsLength.value; i ++ ) {

					createAttractor( i );

				}
				let initialAttractorCount = attractors.length;

				// particles

				const count = Math.pow( 2, 18 );
				const material = new THREE.SpriteNodeMaterial( { blending: THREE.AdditiveBlending, depthWrite: false } );

				const attractorMass = uniform( Number( `1e${7}` ) );
				const particleGlobalMass = uniform( Number( `1e${4}` ) );
				const timeScale = uniform( 1 );
				const spinningStrength = uniform( 2.75 );
				const maxSpeed = uniform( 8 );
				const gravityConstant = 6.67e-11;
				const velocityDamping = uniform( 0.1 );
				const scale = uniform( 0.008 );
				const boundHalfExtent = uniform( 8 );
				const colorA = uniform( color( '#5900ff' ) );
				const colorB = uniform( color( '#ffa575' ) );

				const positionBuffer = instancedArray( count, 'vec3' );
				const velocityBuffer = instancedArray( count, 'vec3' );

				const sphericalToVec3 = Fn( ( [ phi, theta ] ) => {

					const sinPhiRadius = sin( phi );

					return vec3(
						sinPhiRadius.mul( sin( theta ) ),
						cos( phi ),
						sinPhiRadius.mul( cos( theta ) )
					);

				} );

				// init compute

				const init = Fn( () => {

					const position = positionBuffer.element( instanceIndex );
					const velocity = velocityBuffer.element( instanceIndex );

					const basePosition = vec3(
						hash( instanceIndex.add( uint( Math.random() * 0xffffff ) ) ),
						hash( instanceIndex.add( uint( Math.random() * 0xffffff ) ) ),
						hash( instanceIndex.add( uint( Math.random() * 0xffffff ) ) )
					).sub( 0.5 ).mul( vec3( 5, 0.2, 5 ) );
					position.assign( basePosition );

					const phi = hash( instanceIndex.add( uint( Math.random() * 0xffffff ) ) ).mul( PI ).mul( 2 );
					const theta = hash( instanceIndex.add( uint( Math.random() * 0xffffff ) ) ).mul( PI );
					const baseVelocity = sphericalToVec3( phi, theta ).mul( 0.05 );
					velocity.assign( baseVelocity );

				} );

				const initCompute = init().compute( count );

				const reset = () => {

					renderer.compute( initCompute );

				};

				reset();

				// update compute

				const particleMassMultiplier = hash( instanceIndex.add( uint( Math.random() * 0xffffff ) ) ).remap( 0.25, 1 ).toVar();
				const particleMass = particleMassMultiplier.mul( particleGlobalMass ).toVar();

				const update = Fn( () => {

					// const delta = timerDelta().mul( timeScale ).min( 1 / 30 ).toVar();
					const delta = float( 1 / 60 ).mul( timeScale ).toVar(); // uses fixed delta to consistent result
					const position = positionBuffer.element( instanceIndex );
					const velocity = velocityBuffer.element( instanceIndex );

					// force

					const force = vec3( 0 ).toVar();

					Loop( attractorsLength, ( { i } ) => {

						const attractorPosition = attractorsPositions.element( i );
						const attractorRotationAxis = attractorsRotationAxes.element( i );
						const attractorMagnitude = attractorsMagnitudes.element( i );
						const toAttractor = attractorPosition.sub( position );
						const distance = toAttractor.length();
						const direction = toAttractor.normalize();

						// gravity
						const gravityStrength = attractorMass.mul( particleMass ).mul( gravityConstant ).mul( attractorMagnitude ).div( distance.pow( 2 ) ).toVar();
						const gravityForce = direction.mul( gravityStrength );
						force.addAssign( gravityForce );

						// spinning
						const spinningForce = attractorRotationAxis.mul( gravityStrength ).mul( spinningStrength );
						const spinningVelocity = spinningForce.cross( toAttractor );
						force.addAssign( spinningVelocity );

					} );

					// velocity

					velocity.addAssign( force.mul( delta ) );
					const speed = velocity.length();
					If( speed.greaterThan( maxSpeed ), () => {

						velocity.assign( velocity.normalize().mul( maxSpeed ) );

					} );
					velocity.mulAssign( velocityDamping.oneMinus() );

					// position

					position.addAssign( velocity.mul( delta ) );

					// box loop

					const halfHalfExtent = boundHalfExtent.div( 2 ).toVar();
					position.assign( mod( position.add( halfHalfExtent ), boundHalfExtent ).sub( halfHalfExtent ) );

				} );
				updateCompute = update().compute( count ).setName( 'Update Particles' );

				// nodes

				material.positionNode = positionBuffer.toAttribute();

				material.colorNode = Fn( () => {

					const velocity = velocityBuffer.toAttribute();
					const speed = velocity.length();
					const colorMix = speed.div( maxSpeed ).smoothstep( 0, 0.5 );
					const finalColor = mix( colorA, colorB, colorMix );

					return vec4( finalColor, 1 );

				} )();

				material.scaleNode = particleMassMultiplier.mul( scale );

				// mesh

				const geometry = new THREE.PlaneGeometry( 1, 1 );
				const mesh = new THREE.InstancedMesh( geometry, material, count );
				scene.add( mesh );

				// debug

				const gui = renderer.inspector.createParameters( 'Parameters' );

				const controllerMap = {};
				const initialState = {};

				function track( controller, path ) {

					controllerMap[ path ] = controller;
					initialState[ path ] = controller.getValue();
					controller.addEventListener( 'change', ( { value } ) => {

						recordChange( path, value );

					} );

					controller.domElement.addEventListener( 'keydown', ( e ) => {

						if ( e.key === '\\' && e.target.tagName !== 'TEXTAREA' ) {

							e.preventDefault();
							e.stopPropagation();

							let baseName = currentPresetName;
							if ( baseName.includes( ' draft' ) ) {

								const candidates = Object.keys( presets ).filter( k =>
									baseName.startsWith( k + '.' ) && ! k.includes( ' draft' )
								);
								candidates.sort( ( a, b ) => b.length - a.length );
								if ( candidates.length > 0 ) {

									baseName = candidates[ 0 ];

								}

							}

							const preset = presets[ baseName ];
							if ( ! preset ) return;

							let newValue;
							const attractorMatch = path.match( /^attractors\[(\d+)\]\.(position|rotation)\.([xyz])$/ );
							const magnitudeMatch = path.match( /^attractors\[(\d+)\]\.magnitude$/ );

							if ( attractorMatch ) {

								const index = parseInt( attractorMatch[ 1 ] );
								const prop = attractorMatch[ 2 ];
								const axis = attractorMatch[ 3 ];
								const axisIndex = axis === 'x' ? 0 : axis === 'y' ? 1 : 2;

								if ( preset.attractors && preset.attractors[ index ] ) {

									newValue = preset.attractors[ index ][ prop ][ axisIndex ];

								}

							} else if ( magnitudeMatch ) {

								const index = parseInt( magnitudeMatch[ 1 ] );

								if ( preset.attractors && preset.attractors[ index ] ) {

									newValue = preset.attractors[ index ].magnitude;

								}

							} else {

								newValue = preset[ path ];

							}

							if ( newValue !== undefined ) {

								controller.setValue( newValue );

							}

						}

					} );

					return controller;

				}

				function getJournalDuration() {

					if ( configuration.journal.length === 0 ) return 0;
					return configuration.journal[ configuration.journal.length - 1 ].time;

				}

				function recordChange( path, value ) {

					if ( ! configuration.recording || isPlaying || isApplyingConfiguration ) return;

					const now = Date.now();
					if ( configuration.journal.length === 0 ) {

						journalStartTime = now;

					}

					const time = now - journalStartTime;
					configuration.journal.push( {
						time: time,
						path: path,
						value: value
					} );

					if ( timeSlider ) {

						const duration = time;
						if ( duration > parseFloat( timeSlider.slider.max ) ) {

							timeSlider.slider.max = duration;
							timeSlider.numberInput.max = duration;

						}

						if ( now - lastGuiUpdate > 100 ) {

							isRecordingUpdate = true;
							timeSlider.slider.value = duration;
							timeSlider.numberInput.value = duration;
							isRecordingUpdate = false;
							configuration.playbackTime = duration;
							updateTicks();
							lastGuiUpdate = now;

						}

					}

				}

				track( gui.add( configuration, 'velocityDamping', 0, 0.1, 0.001 ).name( 'velocityDamping' ), 'velocityDamping' ).onChange( value => {

					velocityDamping.value = value;
					updateExport();

				} ).listen();

				track( gui.add( configuration, 'spinningStrength', 0, 10, 0.01 ).name( 'spinningStrength' ), 'spinningStrength' ).onChange( value => {

					spinningStrength.value = value;
					updateExport();

				} ).listen();

				track( gui.add( configuration, 'scale', 0, 0.1, 0.001 ).name( 'scale' ), 'scale' ).onChange( value => {

					scale.value = value;
					updateExport();

				} ).listen();

				track( gui.add( configuration, 'boundHalfExtent', 0, 20, 0.01 ).name( 'boundHalfExtent' ), 'boundHalfExtent' ).onChange( value => {

					boundHalfExtent.value = value;
					updateExport();

				} ).listen();


				track( gui.add( configuration, 'controlsMode', [ 'translate', 'rotate', 'none' ] ), 'controlsMode' ).onChange( updateControlsMode ).listen();

				window.addEventListener( 'dblclick', ( event ) => {

					if ( configuration.controlsMode === 'none' ) return;

					const mouse = new THREE.Vector2();
					mouse.x = ( event.clientX / window.innerWidth ) * 2 - 1;
					mouse.y = - ( event.clientY / window.innerHeight ) * 2 + 1;

					const raycaster = new THREE.Raycaster();
					raycaster.setFromCamera( mouse, camera );

					const helpers = attractors.map( a => a.controls.getHelper() );
					const intersects = raycaster.intersectObjects( helpers, true );

					if ( intersects.length > 0 ) {

						configuration.controlsMode = configuration.controlsMode === 'translate' ? 'rotate' : 'translate';
						updateControlsMode();

					}

				} );

				track( gui.add( configuration, 'helperVisible' ), 'helperVisible' ).onChange( value => {

					for ( const attractor of attractors ) {

						attractor.helper.visible = value;

					}
					updateExport();

				} ).listen();

				track( gui.add( configuration, 'helperShowName' ), 'helperShowName' ).onChange( updateAttractorHelpers ).listen();
				track( gui.add( configuration, 'helperShowNamesBelow' ), 'helperShowNamesBelow' ).onChange( updateAttractorLabelPositions ).listen();

				gui.add( configuration, 'reset' );

				const colorsFolder = gui.addFolder( 'Colors' );

				track( colorsFolder.addColor( configuration, 'colorA' ).name( 'colorA' ), 'colorA' ).onChange( value => {

					colorA.value.set( value );
					updateExport();

				} ).listen();

				track( colorsFolder.addColor( configuration, 'colorB' ).name( 'colorB' ), 'colorB' ).onChange( value => {

					colorB.value.set( value );
					updateExport();

				} ).listen();

				function updateControlsColors() {

					const cx = new THREE.Color( configuration.controlsColorX ).getHex( THREE.SRGBColorSpace );
					const cy = new THREE.Color( configuration.controlsColorY ).getHex( THREE.SRGBColorSpace );
					const cz = new THREE.Color( configuration.controlsColorZ ).getHex( THREE.SRGBColorSpace );

					for ( const attractor of attractors ) {

						attractor.controls.setColors( cx, cy, cz );

					}

				}

				track( colorsFolder.addColor( configuration, 'controlsColorX' ).name( 'Controls X' ), 'controlsColorX' ).onChange( updateControlsColors ).listen();
				track( colorsFolder.addColor( configuration, 'controlsColorY' ).name( 'Controls Y' ), 'controlsColorY' ).onChange( updateControlsColors ).listen();
				track( colorsFolder.addColor( configuration, 'controlsColorZ' ).name( 'Controls Z' ), 'controlsColorZ' ).onChange( updateControlsColors ).listen();

				function updateControlsMode() {

					const value = configuration.controlsMode;

					for ( const attractor of attractors ) {

						if ( value === 'none' ) {

							attractor.controls.visible = false;
							attractor.controls.enabled = false;
							attractor.controls.getHelper().visible = false;

						} else {

							attractor.controls.visible = true;
							attractor.controls.enabled = true;
							attractor.controls.getHelper().visible = true;
							attractor.controls.mode = value;

						}

					}
					updateExport();

				}


				function addAttractorGUI( i ) {

					const attractor = attractors[ i ];
					const folder = attractorsFolder.addFolder( `Attractor ${i}` );
					attractor.folder = folder;

					track( folder.add( attractor.reference.position, 'x' ).name( 'Pos X' ), `attractors[${i}].position.x` ).onChange( () => updateAttractor( i ) ).listen();
					track( folder.add( attractor.reference.position, 'y' ).name( 'Pos Y' ), `attractors[${i}].position.y` ).onChange( () => updateAttractor( i ) ).listen();
					track( folder.add( attractor.reference.position, 'z' ).name( 'Pos Z' ), `attractors[${i}].position.z` ).onChange( () => updateAttractor( i ) ).listen();
					track( folder.add( attractor.reference.rotation, 'x' ).name( 'Rot X' ), `attractors[${i}].rotation.x` ).onChange( () => updateAttractor( i ) ).listen();
					track( folder.add( attractor.reference.rotation, 'y' ).name( 'Rot Y' ), `attractors[${i}].rotation.y` ).onChange( () => updateAttractor( i ) ).listen();
					track( folder.add( attractor.reference.rotation, 'z' ).name( 'Rot Z' ), `attractors[${i}].rotation.z` ).onChange( () => updateAttractor( i ) ).listen();
					track( folder.add( attractor, 'magnitude' ).name( 'Magnitude' ), `attractors[${i}].magnitude` ).onChange( () => updateAttractorMagnitude( i ) ).listen();

					attractor.controls.addEventListener( 'change', () => updateExport() );

				}

				const attractorsFolder = gui.addFolder( 'Attractors' );
				attractorsFolder.add( configuration, 'newAttractorPlacement', [ 'origin', 'previous', 'centroid', 'random', 'random within distance' ] ).name( 'Placement' );
				attractorsFolder.add( configuration, 'newAttractorRandomDist', 0, 20 ).name( 'Random Dist' );

				configuration.addAttractor = ( initialState = null ) => {

					if ( attractors.length >= MAX_ATTRACTORS ) {

						alert( 'Max attractors reached' );
						return;

					}

					// Validate initialState to ensure it's not a UI event or controller
					if ( initialState && ( ! initialState.position || ! initialState.rotation ) ) {

						initialState = null;

					}

					const i = attractors.length;
					attractorsLength.value = i + 1;
					createAttractor( i );

					if ( initialState ) {

						attractors[ i ].reference.position.fromArray( initialState.position );
						attractors[ i ].reference.rotation.fromArray( initialState.rotation );
						attractors[ i ].name = initialState.name || `Attractor ${i}`;
						attractors[ i ].magnitude = initialState.magnitude !== undefined ? Math.max( 0, Number( initialState.magnitude ) ) : 1;
						attractorsMagnitudes.array[ i ] = attractors[ i ].magnitude;

					} else {

						const placement = configuration.newAttractorPlacement;
						const position = new THREE.Vector3();
						const rotation = new THREE.Euler();

						if ( placement === 'previous' ) {

							if ( i > 0 ) {

								position.copy( attractors[ i - 1 ].reference.position );
								rotation.copy( attractors[ i - 1 ].reference.rotation );

							}

						} else if ( placement === 'centroid' || placement === 'random within distance' ) {

							if ( i > 0 ) {

								for ( let j = 0; j < i; j ++ ) {

									position.add( attractors[ j ].reference.position );

								}
								position.divideScalar( i );

							}

							if ( placement === 'random within distance' ) {

								const dist = configuration.newAttractorRandomDist;
								const offset = new THREE.Vector3(
									Math.random() - 0.5,
									Math.random() - 0.5,
									Math.random() - 0.5
								).normalize().multiplyScalar( Math.cbrt( Math.random() ) * dist );
								position.add( offset );

							}

						} else if ( placement === 'random' ) {

							const range = configuration.boundHalfExtent;
							position.set(
								( Math.random() - 0.5 ) * 2 * range,
								( Math.random() - 0.5 ) * 2 * range,
								( Math.random() - 0.5 ) * 2 * range
							);

						}

						attractors[ i ].reference.position.copy( position );
						attractors[ i ].reference.rotation.copy( rotation );

					}
					updateAttractor( i );

					addAttractorGUI( i );
					updateExport();

					recordChange( 'sys:addAttractor', {
						position: attractors[ i ].reference.position.toArray(),
						rotation: attractors[ i ].reference.rotation.toArray().slice( 0, 3 ),
						name: attractors[ i ].name,
						magnitude: attractors[ i ].magnitude
					} );

				};

				configuration.removeAttractor = () => {

					if ( attractors.length <= 1 ) {

						alert( 'Cannot remove last attractor' );
						return;

					}

					const i = attractors.length - 1;
					const attractor = attractors.pop();
					scene.remove( attractor.reference );
					scene.remove( attractor.controls.getHelper() );
					attractor.controls.dispose();
					attractor.helper.traverse( ( child ) => {

						if ( child.geometry ) child.geometry.dispose();
						if ( child.material ) child.material.dispose();

					} );

					if ( attractor.folder ) {

						attractorsFolder.paramList.remove( attractor.folder.paramList );

					}

					const prefix = `attractors[${i}].`;
					for ( const key in controllerMap ) {

						if ( key.startsWith( prefix ) ) {

							delete controllerMap[ key ];

						}

					}

					attractorsLength.value = i;
					updateExport();

					recordChange( 'sys:removeAttractor', null );

				};

				attractorsFolder.add( configuration, 'addAttractor' ).name( '➕ Add Attractor' );
				attractorsFolder.add( configuration, 'removeAttractor' ).name( '➖ Remove Attractor' );

				attractors.forEach( ( attractor, i ) => {

					addAttractorGUI( i );

				} );

				function showModal( title, content ) {

					const overlay = document.createElement( 'div' );
					overlay.className = 'modal-overlay';
					overlay.style.zIndex = 9999

					const modal = document.createElement( 'div' );
					modal.className = 'modal-content';

					const header = document.createElement( 'div' );
					header.style.display = 'flex';
					header.style.justifyContent = 'space-between';
					header.style.alignItems = 'center';

					const titleEl = document.createElement( 'h3' );
					titleEl.textContent = title;
					titleEl.style.margin = '0';
					titleEl.style.color = '#fff';

					const close = document.createElement( 'div' );
					close.className = 'modal-close';
					close.textContent = '×';
					close.onclick = () => document.body.removeChild( overlay );

					header.appendChild( titleEl );
					header.appendChild( close );
					modal.appendChild( header );

					const textarea = new ValueJSONTextarea( content );
					modal.appendChild( textarea.domElement );

					overlay.appendChild( modal );
					document.body.appendChild( overlay );

					overlay.onclick = ( e ) => {

						if ( e.target === overlay ) document.body.removeChild( overlay );

					};

				}

				configuration.exportAllPresets = () => {

					showModal( 'All Presets', presets );

				};

				configuration.exportSavedPresets = () => {

					try {

						const savedPresets = JSON.parse( localStorage.getItem( 'attractorPresets' ) || '{}' );
						showModal( 'Saved Presets', savedPresets );

					} catch ( e ) {

						console.error( 'Failed to load presets from localStorage', e );

					}

				};

				configuration.exportCurrentParams = () => {

					showModal( 'Current Params', JSON.parse( configuration.export ) );

				};

				const ioFolder = gui.addFolder( 'IO' );
				ioFolder.add( configuration, 'save' ).name( 'Save Preset' );
				ioFolder.add( configuration, 'exportCurrentParams' ).name( 'Export Current Params' );
				ioFolder.add( configuration, 'exportSavedPresets' ).name( 'Export Saved Presets' );
				ioFolder.add( configuration, 'exportAllPresets' ).name( 'Export All Presets' );
				ioFolder.add( configuration, 'deleteAllLocalPresets' ).name( '🗑️ Delete All Local Presets' );

				const jsonCtrl = ioFolder.add( configuration, 'export' ).name( 'Preset JSON' ).listen();
				const jsonRow = jsonCtrl.domElement.closest( '.list-item-row' );
				jsonRow.style.display = 'flex';
				jsonRow.style.flexDirection = 'column';
				jsonCtrl.domElement.parentElement.style.width = '100%';

				ioFolder.add( configuration, 'load' );

				ioFolder.add( configuration, 'recording' ).name( 'Record simulation (slow)' );
				ioFolder.add( configuration, 'togglePlay' ).name( '▶ Play / ⏸ Pause' );
				ioFolder.add( configuration, 'stop' ).name( '⏹ Stop / ⏮ Reset' );
				ioFolder.add( configuration, 'playbackSpeed', 0.1, 10 ).name( 'Playback Speed' );

				const cameraFolder = gui.addFolder( 'Camera' );
				track( cameraFolder.add( configuration, 'replayCameraTrack', [ 'false', 'exact', 'easing', 'orbit' ] ).name( 'Camera Replay Mode' ), 'replayCameraTrack' ).listen();
				track( cameraFolder.add( configuration, 'replayCameraEasing', 0.01, 1 ).name( 'Camera Easing' ), 'replayCameraEasing' ).listen();
				track( cameraFolder.add( configuration, 'cameraOrbitOn' ).name( 'Orbit On' ), 'cameraOrbitOn' ).listen();
				track( cameraFolder.add( configuration, 'replayCameraOrbitSpeed', 0.01, 2 ).name( 'Orbit Speed' ), 'replayCameraOrbitSpeed' ).listen();
				track( cameraFolder.add( configuration, 'replayCameraOrbitX', -1, 1 ).name( 'Orbit X' ), 'replayCameraOrbitX' ).listen();
				track( cameraFolder.add( configuration, 'replayCameraOrbitY', -1, 1 ).name( 'Orbit Y' ), 'replayCameraOrbitY' ).listen();
				track( cameraFolder.add( configuration, 'replayCameraOrbitZ', -1, 1 ).name( 'Orbit Z' ), 'replayCameraOrbitZ' ).listen();

				function updateCameraFromGui() {

					camera.position.set( configuration.cameraPosX, configuration.cameraPosY, configuration.cameraPosZ );
					controls.target.set( configuration.cameraTargetX, configuration.cameraTargetY, configuration.cameraTargetZ );
					camera.zoom = configuration.cameraZoom;
					camera.fov = configuration.cameraFov;
					camera.near = configuration.cameraNear;
					camera.far = configuration.cameraFar;
					camera.updateProjectionMatrix();
					controls.update();

				}

				track( cameraFolder.add( configuration, 'cameraPosX' ).name( 'Pos X' ), 'cameraPosX' ).onChange( updateCameraFromGui ).listen();
				track( cameraFolder.add( configuration, 'cameraPosY' ).name( 'Pos Y' ), 'cameraPosY' ).onChange( updateCameraFromGui ).listen();
				track( cameraFolder.add( configuration, 'cameraPosZ' ).name( 'Pos Z' ), 'cameraPosZ' ).onChange( updateCameraFromGui ).listen();
				track( cameraFolder.add( configuration, 'cameraTargetX' ).name( 'Target X' ), 'cameraTargetX' ).onChange( updateCameraFromGui ).listen();
				track( cameraFolder.add( configuration, 'cameraTargetY' ).name( 'Target Y' ), 'cameraTargetY' ).onChange( updateCameraFromGui ).listen();
				track( cameraFolder.add( configuration, 'cameraTargetZ' ).name( 'Target Z' ), 'cameraTargetZ' ).onChange( updateCameraFromGui ).listen();
				track( cameraFolder.add( configuration, 'cameraZoom', 0.1, 10 ).name( 'Zoom' ), 'cameraZoom' ).onChange( updateCameraFromGui ).listen();
				track( cameraFolder.add( configuration, 'cameraFov', 1, 179 ).name( 'FOV' ), 'cameraFov' ).onChange( updateCameraFromGui ).listen();
				track( cameraFolder.add( configuration, 'cameraNear', 0.001, 10 ).name( 'Near' ), 'cameraNear' ).onChange( updateCameraFromGui ).listen();
				track( cameraFolder.add( configuration, 'cameraFar', 10, 10000 ).name( 'Far' ), 'cameraFar' ).onChange( updateCameraFromGui ).listen();

				ioFolder.add( configuration, 'showTicks' ).name( 'Indicate param changes' ).onChange( updateTicks );
				timeSlider = ioFolder.add( configuration, 'playbackTime', 0, 1000 ).name( 'Time (ms)' );
				timeSlider.onChange( ( value ) => {

					if ( ! isPlaying && ! isRecordingUpdate ) {

						applyStateAt( value );
						configuration.playbackTime = value;

					}

				} );

				function updateTicks() {

					if ( ! timeSlider ) return;

					if ( configuration.showTicks ) {

						const times = configuration.journal.map( e => e.time );
						timeSlider.setTicks( times );

					} else {

						timeSlider.setTicks( null );

					}

				}

				// Record initial camera state
				recordChange( 'sys:camera', {
					position: camera.position.toArray(),
					target: controls.target.toArray(),
					zoom: camera.zoom,
					fov: camera.fov,
					near: camera.near,
					far: camera.far
				} );

				// init history
				addToHistory();

				renderer.setAnimationLoop( animate );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );
				labelRenderer.setSize( window.innerWidth, window.innerHeight );

			}

			const clock = new THREE.Timer();

			function animate() {

				clock.update()
				const dt = clock.getDelta();

				if ( configuration.cameraOrbitOn || ( isPlaying && configuration.replayCameraTrack === 'orbit' ) ) {

					const angle = dt * configuration.replayCameraOrbitSpeed;

					// Apply rotation to current camera position relative to target
					const offset = camera.position.clone().sub( controls.target );
					const euler = new THREE.Euler(
						angle * configuration.replayCameraOrbitX,
						angle * configuration.replayCameraOrbitY,
						angle * configuration.replayCameraOrbitZ
					);
					offset.applyEuler( euler );
					camera.position.copy( controls.target ).add( offset );
					labelsNeedUpdate = true;

				}

				if ( controls ) controls.update();

				if ( configuration && configuration.helperShowNamesBelow && labelsNeedUpdate ) {

					updateAttractorLabelPositions();
					labelsNeedUpdate = false;

				}

				if ( updateCompute ) renderer.compute( updateCompute );

				renderer.render( scene, camera );
				labelRenderer.render( scene, camera );

			}

		</script>
	</body>
</html>
